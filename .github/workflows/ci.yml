name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  boot-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install RISC-V toolchain, QEMU and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf qemu-system-misc ninja-build

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build build

      - name: Boot test in QEMU
        run: ctest --test-dir build --output-on-failure
